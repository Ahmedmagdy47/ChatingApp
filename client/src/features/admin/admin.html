<div class="flex flex-col w-full mb-3">
    <div class="flex justify-between items-center">
        <div class="tabs tabs-border tabs-lg text-primary">
            @for (tab of tabs; track $index) {
            <button class="tab"
                [hidden]="tab.value === 'roles' && !accountService.crrentUser()?.roles?.includes('Admin')"
                [class.tab-active]="activeTap === tab.value" (click)="setTab(tab.value)">
                {{tab.label}}
            </button>
            }
        </div>
    </div>
</div>

@if (activeTap === 'roles') {
    <app-user-management/>
}

@if (activeTap === 'photos') {
    <app-photo-management />
}

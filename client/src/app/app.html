<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-10 shadow-xl">

    <h3 class="text-3xl font-bold underline">{{ title() }}</h3>

    <ul class="list">
        @for (member of members(); track members().id) {
            <li class="list-row items-center">
                <img src="/user.png" alt="user avatar" class="w-10 h-10 rounded-full mr-4" />
                <div>
                    {{member.displayName}}
                </div>
            </li>
        }
    </ul>
</div>
